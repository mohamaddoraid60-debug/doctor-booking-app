name: doctor_booking_app
description: A professional doctor booking application for Iraq with real-time appointment management.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.13.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.7.0
  
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  
  # State Management
  provider: ^6.0.0
  get: ^4.6.6
  
  # Payments
  flutter_stripe: ^9.1.0
  http: ^1.1.0
  
  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.0
  
  # UI & UX
  qr_flutter: ^4.1.0
  cached_network_image: ^3.3.0
  lottie: ^2.6.0
  
  # Storage & Cache
  shared_preferences: ^2.2.0
  uuid: ^4.0.0
  
  # Utilities
  logger: ^2.0.0
  connectivity_plus: ^5.0.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
